<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="MiPlata" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="theme-color" content="#f3f0e8" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#111311" media="(prefers-color-scheme: dark)" />
<title>MiPlata</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='26' fill='%231d6a4c'/><text x='50' y='70' font-size='60' text-anchor='middle' fill='%23fffdf8' font-family='Georgia'>$</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #f3f0e8; --surface: #fffdf8; --surface-2: #f2eee4; --line: #e4ded0; --line-2: #d6cfbe;
  --ink: #1c1a15; --muted: #6b6555; --subtle: #8f8873;
  --accent: #1d6a4c; --accent-ink: #fffdf8; --accent-soft: #dcebe2;
  --inc: #1c7f52; --inc-soft: #e1f0e6;
  --exp: #bb4a2b; --exp-soft: #f6e3dc;
  --loan: #9a6514; --loan-soft: #f4e9d2;
  --cust: #6248a8; --cust-soft: #ebe4f7;
  --card: #2b63a6; --card-soft: #e1eaf6;
  --shadow: 0 1px 2px rgba(40,32,10,.06), 0 6px 20px -8px rgba(40,32,10,.12);
  --radius: 18px; --radius-s: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111311; --surface: #191c19; --surface-2: #212521; --line: #2b302b; --line-2: #384038;
    --ink: #ece8dc; --muted: #a59f8f; --subtle: #7b766a;
    --accent: #63c99a; --accent-ink: #0f1a14; --accent-soft: #1d3329;
    --inc: #63c99a; --inc-soft: #1b2f25;
    --exp: #ee8b69; --exp-soft: #3a231b;
    --loan: #e2b35c; --loan-soft: #352a17;
    --cust: #b09bf0; --cust-soft: #2a2440;
    --card: #85b4ee; --card-soft: #1d2a3b;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -10px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111311; --surface: #191c19; --surface-2: #212521; --line: #2b302b; --line-2: #384038;
  --ink: #ece8dc; --muted: #a59f8f; --subtle: #7b766a;
  --accent: #63c99a; --accent-ink: #0f1a14; --accent-soft: #1d3329;
  --inc: #63c99a; --inc-soft: #1b2f25;
  --exp: #ee8b69; --exp-soft: #3a231b;
  --loan: #e2b35c; --loan-soft: #352a17;
  --cust: #b09bf0; --cust-soft: #2a2440;
  --card: #85b4ee; --card-soft: #1d2a3b;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -10px rgba(0,0,0,.5);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); }
body { font-family: "Manrope", system-ui, sans-serif; color: var(--ink); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.num { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.serif { font-family: "Fraunces", Georgia, serif; font-optical-sizing: auto; }

/* ── Shell ── */
.app { min-height: 100vh; display: grid; grid-template-columns: 240px 1fr; }
.sidebar { position: sticky; top: 0; height: 100vh; padding: 22px 16px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; background: var(--bg); }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; font-family: "Fraunces", serif; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
.brand-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 16px; font-family: "Fraunces", serif; }
.nav-btn { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; border: 0; background: transparent; color: var(--muted); font-weight: 600; font-size: 14px; text-align: left; }
.nav-btn:hover { background: var(--surface-2); color: var(--ink); }
.nav-btn.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.nav-btn svg { width: 19px; height: 19px; }
.sidebar .btn-primary { margin: 0 0 14px; justify-content: center; }
.sidebar-foot { margin-top: auto; padding: 10px 12px; font-size: 12px; color: var(--subtle); display: flex; align-items: center; gap: 8px; }
.dot { width: 7px; height: 7px; border-radius: 99px; background: var(--subtle); display: inline-block; }
.dot.on { background: var(--inc); }

.content { min-width: 0; padding: 28px 36px 80px; max-width: 1180px; width: 100%; }
.topbar { display: none; }
.bottomnav { display: none; }
.fab { display: none; }

/* ── Page header ── */
.page-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.page-h h1 { font-family: "Fraunces", serif; font-weight: 600; font-size: 30px; letter-spacing: -0.02em; margin: 0; line-height: 1.1; }
.eyebrow { font-size: 12px; font-weight: 700; color: var(--subtle); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }

.month { display: inline-flex; align-items: center; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; box-shadow: var(--shadow); }
.month button { width: 32px; height: 32px; border-radius: 99px; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; }
.month button:disabled { opacity: .3; cursor: default; }
.month button:not(:disabled):hover { background: var(--surface-2); color: var(--ink); }
.month button svg { width: 16px; height: 16px; }
.month select { appearance: none; -webkit-appearance: none; border: 0; background: transparent; font-weight: 700; font-size: 14px; padding: 0 8px; min-width: 92px; text-align: center; text-align-last: center; cursor: pointer; outline: none; }

/* ── Cards ── */
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: 1fr 1fr; }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.top-grid { grid-template-columns: minmax(0,1.35fr) minmax(0,1fr); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
.card-h h3 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
.card-h .sub { font-size: 12px; color: var(--subtle); font-weight: 600; }
.link { border: 0; background: none; color: var(--accent); font-weight: 700; font-size: 13px; padding: 0; }

.hero { position: relative; overflow: hidden; background: var(--accent); color: var(--accent-ink); border-radius: 22px; padding: 26px 28px; box-shadow: var(--shadow); }
.hero::after { content: ""; position: absolute; right: -60px; top: -80px; width: 260px; height: 260px; border-radius: 50%; border: 36px solid rgba(255,255,255,.07); }
.hero-l { font-size: 13px; font-weight: 700; opacity: .8; letter-spacing: .02em; }
.hero-v { font-family: "Fraunces", serif; font-size: 46px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.05; margin: 6px 0 18px; }
.hero-sub { display: flex; gap: 28px; flex-wrap: wrap; position: relative; z-index: 1; }
.hero-sub div { font-size: 12px; opacity: .8; font-weight: 600; }
.hero-sub b { display: block; font-size: 17px; opacity: 1; font-weight: 700; margin-top: 2px; }

.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stat-l { font-size: 12px; font-weight: 700; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.stat-v { font-size: 21px; font-weight: 800; letter-spacing: -0.02em; }
.sw { width: 8px; height: 8px; border-radius: 3px; display: inline-block; flex: none; }

.tone-inc { color: var(--inc); } .tone-exp { color: var(--exp); } .tone-loan { color: var(--loan); } .tone-cust { color: var(--cust); } .tone-card { color: var(--card); } .tone-muted { color: var(--muted); }
.bg-inc { background: var(--inc); } .bg-exp { background: var(--exp); } .bg-loan { background: var(--loan); } .bg-cust { background: var(--cust); } .bg-card { background: var(--card); }

/* month summary */
.split { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
.split .k { font-size: 12px; color: var(--muted); font-weight: 600; }
.split .v { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
.ratio { height: 10px; border-radius: 99px; background: var(--inc-soft); overflow: hidden; display: flex; }
.ratio > div { height: 100%; background: var(--exp); border-radius: 99px; }
.hint { font-size: 12px; color: var(--subtle); margin-top: 8px; }

/* bars */
.bar-row { margin-bottom: 13px; }
.bar-top { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; margin-bottom: 6px; }
.bar-top span:first-child { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-top span:last-child { font-weight: 700; white-space: nowrap; }
.bar-top small { color: var(--subtle); font-weight: 600; margin-left: 6px; }
.bar { height: 7px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > div { height: 100%; border-radius: 99px; }

/* person rows */
.prow { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.prow:first-child { border-top: 0; padding-top: 0; }
.avatar { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; font-size: 14px; flex: none; }
.prow .who { flex: 1; min-width: 0; }
.prow .who b { display: block; font-size: 14px; }
.prow .who span { font-size: 12px; color: var(--muted); }
.prow .amt { font-weight: 800; font-size: 15px; white-space: nowrap; }

/* ── Movement feed ── */
.feed-tools { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
.search { flex: 1; min-width: 200px; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; height: 42px; }
.search svg { width: 17px; height: 17px; color: var(--subtle); flex: none; }
.search input { border: 0; outline: none; background: transparent; width: 100%; font-size: 14px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 8px 13px; border-radius: 9px; font-size: 13px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.totals { display: flex; gap: 18px; font-size: 13px; color: var(--muted); font-weight: 600; margin: -4px 0 14px; flex-wrap: wrap; }
.totals b { font-weight: 800; }
.day-h { font-size: 12px; font-weight: 800; color: var(--subtle); text-transform: uppercase; letter-spacing: .06em; padding: 16px 4px 8px; }
.day-h:first-child { padding-top: 0; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.mrow { display: flex; align-items: center; gap: 12px; padding: 12px 16px; width: 100%; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; }
.mrow:first-child { border-top: 0; }
.mrow:hover { background: var(--surface-2); }
.micon { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; font-size: 18px; flex: none; }
.mmain { flex: 1; min-width: 0; }
.mtitle { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mmeta { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mamt { text-align: right; white-space: nowrap; }
.mamt b { display: block; font-size: 15px; font-weight: 800; }
.mamt span { font-size: 11px; color: var(--subtle); font-weight: 600; }

.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.inc { background: var(--inc-soft); color: var(--inc); } .chip.exp { background: var(--exp-soft); color: var(--exp); }
.chip.loancard { background: var(--loan-soft); color: var(--loan); } .chip.cust { background: var(--cust-soft); color: var(--cust); } .chip.card { background: var(--card-soft); color: var(--card); }

/* ── Loans ── */
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
.pill { border: 1px solid var(--line); background: var(--surface); padding: 7px 13px; border-radius: 99px; font-size: 13px; font-weight: 700; color: var(--muted); }
.pill.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.loancard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
.loancard.done { opacity: .62; }
.loan-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
.loan-top .who b { font-size: 16px; display: block; }
.loan-top .who span { font-size: 12px; color: var(--muted); }
.loan-amt { text-align: right; }
.loan-amt b { font-size: 18px; font-weight: 800; display: block; }
.loan-amt .chip { margin-top: 5px; }
.prog { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin: 6px 0 6px; }
.prog > div { height: 100%; background: var(--inc); border-radius: 99px; }
.prog-l { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; }
.pays { margin-top: 12px; background: var(--surface-2); border-radius: 12px; padding: 4px 12px; }
.pay { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; padding: 7px 0; border-top: 1px solid var(--line); color: var(--muted); }
.pay:first-child { border-top: 0; }
.pay b { color: var(--inc); font-weight: 800; }
.loan-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }

/* ── Buttons & forms ── */
.btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 11px; padding: 9px 14px; font-weight: 700; font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: var(--line-2); }
.btn svg { width: 16px; height: 16px; }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn-primary:hover { filter: brightness(1.06); }
.btn-danger { color: var(--exp); background: var(--exp-soft); border-color: transparent; }
.btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn-block { width: 100%; justify-content: center; padding: 13px; font-size: 15px; border-radius: 13px; }
.icon-btn { width: 36px; height: 36px; border-radius: 10px; border: 0; background: var(--surface-2); color: var(--muted); display: grid; place-items: center; flex: none; }
.icon-btn svg { width: 17px; height: 17px; }

.form { display: grid; gap: 16px; }
.field-l { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 7px; display: flex; justify-content: space-between; }
.input { width: 100%; background: var(--surface-2); border: 1px solid transparent; border-radius: 12px; padding: 12px 14px; font-size: 15px; outline: none; }
.input:focus { border-color: var(--accent); background: var(--surface); }
textarea.input { font-family: ui-monospace, monospace; font-size: 12px; resize: vertical; }
.amount { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; padding: 12px 16px; }
.amount-wrap { position: relative; }
.amount-wrap::before { content: "$"; position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 22px; font-weight: 700; color: var(--subtle); }
.amount-wrap .amount { padding-left: 36px; }
.opts { display: flex; gap: 6px; flex-wrap: wrap; }
.opt { border: 1px solid var(--line); background: var(--surface); padding: 8px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--muted); }
.opt.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 800; }
.note { font-size: 12px; font-weight: 600; padding: 10px 12px; border-radius: 10px; }
.note.card { background: var(--card-soft); color: var(--card); }
.note.loancard { background: var(--loan-soft); color: var(--loan); }
.note.inc { background: var(--inc-soft); color: var(--inc); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.confirm { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; font-size: 13px; font-weight: 700; color: var(--exp); }

/* ── Sheet / modal ── */
.sheet-bg { position: fixed; inset: 0; background: rgba(15,12,5,.45); backdrop-filter: blur(3px); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; animation: fade .15s ease; }
.sheet { background: var(--surface); border-radius: 22px; width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; padding: 22px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.4); animation: rise .2s ease; }
.sheet-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.sheet-h h3 { margin: 0; font-family: "Fraunces", serif; font-weight: 600; font-size: 22px; letter-spacing: -0.02em; }
.grab { display: none; }
@keyframes fade { from { opacity: 0 } }
@keyframes rise { from { transform: translateY(14px); opacity: 0 } }

.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.quick button { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 18px 14px; text-align: left; display: flex; flex-direction: column; gap: 10px; }
.quick button:hover { border-color: var(--line-2); }
.quick b { font-size: 15px; }
.quick span { font-size: 12px; color: var(--muted); }

.empty { text-align: center; color: var(--subtle); padding: 36px 16px; font-size: 14px; }
.empty b { display: block; color: var(--muted); font-size: 15px; margin-bottom: 4px; }

.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 12px; font-size: 14px; font-weight: 700; z-index: 200; box-shadow: var(--shadow); animation: rise .2s ease; max-width: calc(100vw - 32px); text-align: center; }

/* charts */
.chart text { fill: var(--subtle); font-size: 11px; font-family: "Manrope", sans-serif; }
.chart .gl { stroke: var(--line); }
.chart .zero { stroke: var(--line-2); }
.legend { display: flex; gap: 16px; font-size: 12px; font-weight: 700; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.tip { position: absolute; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 8px 11px; font-size: 12px; font-weight: 700; pointer-events: none; transform: translate(-50%, -110%); white-space: nowrap; }

.settings-sec { margin-bottom: 16px; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { display: inline-flex; align-items: center; gap: 8px; background: var(--surface-2); border-radius: 10px; padding: 7px 8px 7px 12px; font-size: 13px; font-weight: 600; }
.tag button { border: 0; background: transparent; color: var(--subtle); padding: 0 4px; font-size: 16px; line-height: 1; }
.tag.warn { background: var(--exp-soft); color: var(--exp); }
.mono { font-family: ui-monospace, monospace; font-size: 12px; word-break: break-all; }

/* ── Mobile ── */
@media (max-width: 860px) {
  .app { display: block; padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  .sidebar { display: none; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 4px; padding-top: calc(14px + env(safe-area-inset-top)); }
  .topbar .brand { padding: 0; font-size: 20px; }
  .content { padding: 10px 16px 110px; }
  .keep2 { grid-template-columns: 1fr 1fr !important; }
  .page-h { margin-bottom: 16px; align-items: center; }
  .page-h h1 { font-size: 25px; }
  .grid-2, .grid-3, .top-grid { grid-template-columns: 1fr; }
  .stats3 { grid-template-columns: 1fr 1fr; }
  .stats3 > :last-child { grid-column: 1 / -1; }
  .hero { padding: 22px; border-radius: 20px; }
  .hero-v { font-size: 38px; }
  .card { padding: 16px; }
  .stat { padding: 14px; }
  .stat-v { font-size: 18px; }
  .split .v { font-size: 16px; }
